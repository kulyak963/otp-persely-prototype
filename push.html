<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель пушей</title>
<style>
:root{--bg:#EEF0F5;--card:#fff;--ink:#2B3038;--muted:#8C919B;--green:#52AE30;--line:#E2E5EB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Open Sans",-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border-radius:16px;box-shadow:0 4px 16px rgba(48,60,90,.08);padding:18px;margin-bottom:14px}
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{font-size:28px;font-weight:700}
.count small{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sc{text-align:left;border:0;background:var(--card);border-radius:16px;box-shadow:0 4px 16px rgba(48,60,90,.08);padding:14px 16px;cursor:pointer;font:inherit;color:inherit}
.sc:hover{box-shadow:0 0 0 2px var(--green),0 4px 16px rgba(48,60,90,.08)}
.sc b{display:block;margin-bottom:6px}
.sc .pv{font-size:13px;color:var(--muted)}
.sc .who{display:inline-block;font-size:12px;font-weight:600;color:var(--green);margin-top:8px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.btn{border:0;background:var(--green);color:#fff;font:inherit;font-weight:700;padding:12px 20px;border-radius:24px;cursor:pointer;margin-top:14px}
.btn.g{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.row>div{flex:1;min-width:160px}
#log{font-size:13px;color:var(--muted);white-space:pre-line;margin-top:10px}
h2{font-size:17px;margin:24px 0 10px}
</style>
</head>
<body>
<main>
  <h1>Панель пушей</h1>
  <p class="sub">Открывается только на этом ноутбуке. Нажмите на карточку, и уведомление придёт на все телефоны, где включены пуши.</p>

  <div class="card status">
    <div><div class="count" id="count">…<small>телефонов подключено</small></div><div id="hint" class="sub" style="margin:4px 0 0"></div></div>
    <div class="row" style="align-items:center">
      <div style="min-width:180px"><label for="delay" style="margin-top:0">Задержка перед отправкой</label>
        <select id="delay"><option value="0">Сразу</option><option value="5" selected>Через 5 секунд</option><option value="10">Через 10 секунд</option><option value="30">Через 30 секунд</option></select></div>
    </div>
  </div>

  <h2>Готовые пуши для демо</h2>
  <div class="grid" id="grid"></div>

  <h2>Свой текст</h2>
  <div class="card">
    <label for="t">Заголовок</label><input id="t" value="OTP demo">
    <label for="b">Текст</label><input id="b" value="This week is still open. Any amount by Sunday keeps your streak.">
    <label for="u">Какой экран открыть при нажатии</label>
    <select id="u"><option value="./">Home</option><option value="./#persely">Persely</option><option value="./#tranzakciok">Transactions</option><option value="./#kedvezmenyek">Discounts</option><option value="./#kartyaim">My cards</option></select>
    <button class="btn" id="send">Отправить</button>
    <button class="btn g" id="clear" title="Убрать все подключённые телефоны">Сбросить телефоны</button>
    <div id="log"></div>
  </div>
</main>
<script>
const SC = [
  {who:'Банк сейчас', title:'Card payment', body:'-5 240 Ft · LIDL MAGYARORSZÁG. Balance: 82 210 Ft', url:'./#tranzakciok'},
  {who:'Наша идея', title:'Persi · Persely', body:"Salary's in: +75 000 Ft. Move 7 500 Ft to Summer holiday?", url:'./#payday'},
  {who:'Наша идея', title:'Persi · Persely', body:'Your 3.0% Junior rate paid 170 Ft this month, after tax.', url:'./#hub'},
  {who:'Наша идея', title:'Persi · Persely', body:'Dóri added 5 000 Ft to Balaton in July. Your turn?', url:'./#hub'},
  {who:'Наша идея', title:'Persi · Persely', body:'Your Junior package ends in 30 days. Get your salary paid to OTP and keep 3.0% for 12 more months.', url:'./#grad'},
  {who:'Банк сейчас', title:'Money received', body:'+20 000 Ft from NAGY PÉTER – instant transfer', url:'./#tranzakciok'},
  {who:'Наша идея', title:'Persi · Persely', body:'🔥 Your 8-week streak ends Sunday. Drop in any amount and it keeps going.', url:'./#hub'},
  {who:'Наша идея', title:'Persi · Persely', body:'Your November story is ready. Take a look.', url:'./#story'},
  {who:'Банк сейчас', title:'New discount', body:'15% instant discount at Pizzeria Roma. Activate it now!', url:'./#kedvezmenyek'}
];
const $ = s => document.querySelector(s);
// on a host (Render) the panel needs the presenter key: open push.html?key=YOUR_ADMIN_KEY
const KEY = new URLSearchParams(location.search).get('key') || '';
const H = KEY ? {'x-admin-key': KEY} : {};
$('#grid').innerHTML = SC.map((s,i)=>`<button class="sc" data-i="${i}"><b>${s.title}</b><div class="pv">${s.body}</div><span class="who">${s.who}</span></button>`).join('');
async function refresh(){
  try{ const r = await (await fetch('/api/subs', {headers:H})).json();
    $('#count').innerHTML = `${r.total}<small>${r.total===1?'телефон подключён':'телефонов подключено'}</small>`;
    $('#hint').textContent = r.total ? 'Можно отправлять.' : 'На iPhone: откройте приложение с иконки → More → Notifications → «Turn on notifications».';
  }catch(e){ $('#count').textContent = 'Сервер не отвечает'; }
}
async function send(msg){
  const delay = +$('#delay').value;
  $('#log').textContent = 'Отправляю…';
  try{
    const r = await (await fetch('/api/push',{method:'POST',headers:{'content-type':'application/json', ...H},body:JSON.stringify({...msg, delay})})).json();
    $('#log').textContent = r.scheduled ? `Запланировано: придёт через ${r.delay} с на ${r.total} тел.` :
      `Отправлено: ${r.sent}, не дошло: ${r.failed}${r.errors && r.errors.length ? '\n' + r.errors.join('\n') : ''}`;
  }catch(e){ $('#log').textContent = 'Ошибка: сервер не отвечает'; }
  refresh();
}
$('#grid').addEventListener('click', e=>{ const b=e.target.closest('.sc'); if(b){ send(SC[+b.dataset.i]); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); } });
$('#send').onclick = () => send({title:$('#t').value, body:$('#b').value, url:$('#u').value});
$('#clear').onclick = async () => { if(confirm('Убрать все подключённые телефоны? Им придётся заново включить уведомления.')){ await fetch('/api/clear',{method:'POST', headers:H}); refresh(); } };
refresh(); setInterval(refresh, 4000);
</script>
</body>
</html>
